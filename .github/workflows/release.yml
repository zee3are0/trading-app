name: Release to Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # This app was created with 3.47.8 (Dart 3.13.7). The TastyNoms
          # pin at 3.41.9 is for that app's device history — this is a new
          # app with no legacy AOT snapshot concerns. Only change this after
          # confirming the new version builds AND launches on device.
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/app/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          PROPS

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome || true
          df -h /

      - name: Build release APK
        run: |
          ( while true; do echo "[mem] $(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}') $(free -m | awk '/Swap:/{print "swap="$3"MB"}') disk=$(df -h / | awk 'NR==2{print $4}')"; sleep 60; done ) &
          flutter build apk --release --build-number=${{ github.run_number }}

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: trading
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.inputs.notes != '' && github.event.inputs.notes || github.event.head_commit.message }}
