name: tradingbot
description: "Trading system mobile app — dashboard, broker, strategies, and push notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  go_router: ^14.0.0
  provider: ^6.1.0
  google_sign_in: ^6.2.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
